server:
  port: 8085
  address: 0.0.0.0

FireflyMall:
  db:
    host: localhost
    port: 3306

alipay:
  # 支付宝网关
  GATEWAY: "https://openapi-sandbox.dl.alipaydev.com/gateway.do"
  # 应用ID
  APPID: "9021000157614438"
  # 应用私钥
  APP_PRIVATE_KEY: ""
  # 支付宝公钥
  ALIPAY_PUBLIC_KEY: ""
  # 签名类型
  SIGN_TYPE: "RSA2"
  # 字符编码
  CHARSET: "UTF-8"
  # 数据格式
  FORMAT: "json"
  # 同步返回地址
  RETURN_URL: "http://localhost:8080/pay/Alipay/getStatus"
  # 是否为沙箱环境
  SANDBOX: true

