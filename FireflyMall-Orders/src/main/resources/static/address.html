<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>高德地图输入提示与地址信息</title>
    <link rel="stylesheet" href="https://cache.amap.com/lbs/static/main1119.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #1a2a6c, #b21f1f, #fdbb2d);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 1200px;
            background: rgba(255, 255, 255, 0.92);
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }

        header {
            background: linear-gradient(to right, #1a237e, #283593);
            color: white;
            padding: 20px;
            text-align: center;
        }

        h1 {
            font-size: 28px;
            margin-bottom: 8px;
            font-weight: 600;
        }

        .subtitle {
            font-size: 16px;
            opacity: 0.9;
        }

        .content {
            display: flex;
            flex-wrap: wrap;
            min-height: 500px;
        }

        .map-section {
            flex: 1;
            min-width: 300px;
            padding: 20px;
        }

        #map-container {
            width: 100%;
            height: 400px;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        .control-section {
            flex: 1;
            min-width: 300px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        label {
            font-weight: 600;
            color: #333;
            font-size: 16px;
        }

        #tipinput {
            padding: 14px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 16px;
            transition: all 0.3s;
        }

        #tipinput:focus {
            border-color: #3f51b5;
            outline: none;
            box-shadow: 0 0 0 3px rgba(63, 81, 181, 0.2);
        }

        .info-card {
            background: white;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
            border-left: 5px solid #3f51b5;
            display: none;
        }

        .info-card h3 {
            color: #1a237e;
            margin-bottom: 15px;
            font-size: 20px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .info-card h3 i {
            font-size: 22px;
        }

        .info-item {
            display: flex;
            margin-bottom: 12px;
            padding-bottom: 12px;
            border-bottom: 1px solid #f0f0f0;
        }

        .info-label {
            font-weight: 600;
            color: #555;
            min-width: 80px;
        }

        .info-value {
            color: #333;
            flex: 1;
        }

        footer {
            text-align: center;
            padding: 15px;
            background: #f5f5f5;
            color: #666;
            font-size: 14px;
        }

        @media (max-width: 768px) {
            .content {
                flex-direction: column;
            }

            .map-section, .control-section {
                width: 100%;
            }
        }
    </style>
</head>
<body>
<div class="container">
    <header>
        <h1>高德地图输入提示</h1>
        <p class="subtitle">输入地点关键字，选择后查看详细信息</p>
    </header>

    <div class="content">
        <div class="map-section">
            <div id="map-container"></div>
        </div>

        <div class="control-section">
            <div class="input-group">
                <label for="tipinput">请输入地点关键字：</label>
                <input type="text" id="tipinput" placeholder="例如：天安门、故宫、北京大学...">
            </div>

            <div class="info-card" id="addressInfo">
                <h3>📍 地址详情</h3>
                <div class="info-item">
                    <span class="info-label">名称：</span>
                    <span class="info-value" id="info-name">-</span>
                </div>
                <div class="info-item">
                    <span class="info-label">地址：</span>
                    <span class="info-value" id="info-address">-</span>
                </div>
                <div class="info-item">
                    <span class="info-label">经纬度：</span>
                    <span class="info-value" id="info-location">-</span>
                </div>
                <div class="info-item">
                    <span class="info-label">区县：</span>
                    <span class="info-value" id="info-district">-</span>
                </div>
                <div class="info-item">
                    <span class="info-label">城市：</span>
                    <span class="info-value" id="info-city">-</span>
                </div>
            </div>
        </div>
    </div>

    <footer>
        <p>基于高德地图API开发 | 输入提示与地址信息展示</p>
    </footer>
</div>

<script type="text/javascript">
    window._AMapSecurityConfig = {
        securityJsCode: "fcebf73a4623edaf5242b14d431076c9",
    };
</script>
<script type="text/javascript" src="https://webapi.amap.com/maps?v=2.0&key=499c03875f161d04b20286be08515638"></script>
<script type="text/javascript">
    // 初始化地图
    var map = new AMap.Map("map-container", {
        resizeEnable: true,
        zoom: 11,
        center: [116.397428, 39.90923] // 默认北京中心
    });

    // 输入提示功能
    var autoOptions = {
        input: "tipinput"
    };

    AMap.plugin(['AMap.PlaceSearch', 'AMap.AutoComplete'], function () {
        var auto = new AMap.AutoComplete(autoOptions);
        var placeSearch = new AMap.PlaceSearch({
            map: map,
            panel: "tipinput"
        });

        // 注册监听，当选中某条记录时会触发
        auto.on("select", function(e) {
            placeSearch.setCity(e.poi.adcode);
            placeSearch.search(e.poi.name);

            // 显示选中地址的详细信息
            document.getElementById("addressInfo").style.display = "block";
            document.getElementById("info-name").textContent = e.poi.name || "-";
            document.getElementById("info-address").textContent = e.poi.address || "-";
            document.getElementById("info-location").textContent =
                e.poi.location ? e.poi.location.lng.toFixed(6) + ", " + e.poi.location.lat.toFixed(6) : "-";
            document.getElementById("info-district").textContent = e.poi.district || "-";
            document.getElementById("info-city").textContent = e.poi.cityname || "-";
        });
    });
</script>
</body>
</html>
